[project]
name = "monitorglucosa-scripts"
version = "0.1.0"
description = "Scripts de despliegue, bootstrap SQL y prueba de humo de monitorglucosa"
requires-python = ">=3.13,<3.14"
dependencies = [
    "botocore",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.uv]
package = false
# Regla de versiones (design.md · D15): nada publicado en las últimas dos semanas (fecha determinista del lock - 14 d).
exclude-newer = "2026-10-19T00:00:00Z" # nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-ra"]
markers = [
    "req(*criteria): criterios de la spec que verifica la prueba, p. ej. fase-1a:7.4 (los lee kspec trace)",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["db_bootstrap", "deploy", "runner", "smoke_test"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["runner.py", "db_bootstrap.py", "smoke_test.py", "deploy.py", "tests"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true
